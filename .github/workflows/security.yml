name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed vulnerabilities surface without a push.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    # Code scanning uploads need GitHub Advanced Security, which is free only on
    # public repositories. The analysis itself runs fine while private, but the
    # upload is rejected — so skip until the repo is public, then it self-enables.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload results to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    # Only meaningful on a PR (it diffs base against head), and the dependency
    # graph API it needs requires Advanced Security on a private repository.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  npm-audit:
    name: npm audit (runtime deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      # The extension ships unbundled, so runtime dependencies are distributed
      # to every user inside the VSIX — audit those strictly.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: vscode-extension
      # Dev dependencies never reach users; report but do not block.
      - name: Audit dev dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: vscode-extension

  pip-audit:
    name: pip-audit (plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install plugin
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install ./pytest-plugin
      # No --strict: pytest-bdd-orama is not published yet, so it cannot be
      # resolved on PyPI and --strict would treat that as a hard failure.
      # Third-party dependencies are still audited and still fail the job.
      - name: Audit installed packages
        run: python -m pip_audit --desc --progress-spinner=off

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard analyses the default branch (so not PRs), and publishing its
    # result requires a public repository.
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write        # publishes the signed result for the public badge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          sarif_file: scorecard-results.sarif
