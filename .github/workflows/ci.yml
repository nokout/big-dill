name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint & typecheck (extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run typecheck
        working-directory: vscode-extension
      - run: npm run lint
        working-directory: vscode-extension

  test-extension:
    name: Test extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: vscode-extension
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo '### Extension coverage'
            echo '```'
            npx jest --coverage --coverageReporters=text-summary 2>&1 | tail -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: vscode-extension

  integration-test:
    name: Integration tests (real VS Code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      # Downloads a real VS Code build and runs the extension inside it, so it
      # needs a display. Everything else in CI is headless.
      - name: Run integration tests under xvfb
        run: xvfb-run -a npm run test:integration
        working-directory: vscode-extension

  test-plugin:
    name: Test plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install plugin with test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./pytest-plugin
      - name: Run plugin tests
        run: python -m pytest -q
        working-directory: pytest-plugin

  lint-plugin:
    name: Lint plugin (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check
          src: pytest-plugin

  playground:
    name: Playground end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install playground
        # pytest-plugin first: it satisfies the playground's pytest-bdd-orama
        # requirement from the working tree instead of an index.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pytest-plugin
          python -m pip install -e ./playground
      - name: Discovery collects the BDD scenarios
        run: python -m pytest --collect-only -q
        working-directory: playground
      # The playground intentionally contains failing scenarios and lint
      # violations, so a plain run is expected to be red. Assert instead that
      # the lint hook chain fires and produces its diagnostics.
      - name: Lint pass emits diagnostics
        working-directory: playground
        run: |
          python -m pytest --bdd-lint --collect-only | tee lint-output.txt
          grep -q "must start with a capital letter" lint-output.txt \
            || { echo "::error::custom lint hook produced no diagnostic"; exit 1; }

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      - name: Package
        run: npx vsce package --no-rewrite-relative-links -o pytest-bdd-orama.vsix
        working-directory: vscode-extension
      - name: List packaged contents
        run: npx vsce ls
        working-directory: vscode-extension
      # Reviewers can download and install exactly what the PR builds.
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pytest-bdd-orama-vsix
          path: vscode-extension/pytest-bdd-orama.vsix
          if-no-files-found: error
