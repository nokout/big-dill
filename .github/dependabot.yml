version: 2
updates:
  # Extension runtime + dev dependencies. Runtime deps ship inside the VSIX,
  # so keeping these current is a user-facing security concern.
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/vscode must not exceed engines.vscode — vsce refuses to package
      # otherwise ("@types/vscode X greater than engines.vscode Y"). Raising it
      # means dropping support for older VS Code, so it is a deliberate choice
      # made alongside engines.vscode, never an automated bump.
      - dependency-name: "@types/vscode"
      # @cucumber/gherkin 42 is ESM-only and changed its AST types, so it needs
      # a migration rather than a bump — see the tracking issue. Minor and patch
      # updates still come through.
      - dependency-name: "@cucumber/gherkin"
        update-types: ["version-update:semver-major"]
      # @types/node should track the Node bundled in the *minimum* supported
      # VS Code (engines.vscode ^1.87 → Electron 27 → Node 18), not the newest
      # release. Too-new types compile happily against APIs that do not exist
      # for those users, and CI cannot catch it because it tests on a current
      # VS Code. Bump only when engines.vscode moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript 7 cannot install: ts-jest@29 declares
      # peer typescript@">=4.3 <6", so npm ci fails with ERESOLVE. Revisit when
      # ts-jest supports TypeScript 6+.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /pytest-plugin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Actions are pinned by SHA; Dependabot updates the pin and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
