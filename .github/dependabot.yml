version: 2
updates:
  # Extension runtime + dev dependencies. Runtime deps ship inside the VSIX,
  # so keeping these current is a user-facing security concern.
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /pytest-plugin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Actions are pinned by SHA; Dependabot updates the pin and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
