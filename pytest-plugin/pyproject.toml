[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-big-dill"
version = "0.1.0"
description = "pytest plugin for the Big Dill test runner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pytest", "pytest-bdd", "bdd", "gherkin", "cucumber", "vscode"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
]

dependencies = [
    "pytest>=7",
    "pytest-bdd>=6",
    # lint_runner imports `parse` directly; it currently arrives transitively via
    # pytest-bdd, but that is not a guarantee we should rely on.
    "parse>=1.19",
]

[project.urls]
Homepage = "https://github.com/nokout/big-dill"
Repository = "https://github.com/nokout/big-dill"
Issues = "https://github.com/nokout/big-dill/issues"

[project.scripts]
pytest-big-dill = "pytest_big_dill.metadata_gen:main"

[project.entry-points.pytest11]
pytest-big-dill = "pytest_big_dill.hooks"

[tool.pytest.ini_options]
addopts = "-p pytester"

[tool.hatch.build.targets.wheel]
packages = ["pytest_big_dill"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced as an error
]
