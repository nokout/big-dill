[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-bdd-orama"
version = "0.1.0"
description = "pytest plugin for the pytest-bdd-orama test runner"
readme = "README.md"
# Source-available, not open source: use is granted, redistribution and
# modification are not. LicenseRef- is the SPDX form for a custom licence.
license = "LicenseRef-pytest-bdd-orama-Source-Available"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pytest", "pytest-bdd", "bdd", "gherkin", "cucumber", "vscode"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
]

dependencies = [
    "pytest>=7",
    "pytest-bdd>=6",
    # lint_runner imports `parse` directly; it currently arrives transitively via
    # pytest-bdd, but that is not a guarantee we should rely on.
    "parse>=1.19",
]

[project.urls]
Homepage = "https://github.com/nokout/pytest-bdd-orama"
Repository = "https://github.com/nokout/pytest-bdd-orama"
Issues = "https://github.com/nokout/pytest-bdd-orama/issues"

[project.scripts]
pytest-bdd-orama = "pytest_bdd_orama.metadata_gen:main"

[project.entry-points.pytest11]
pytest-bdd-orama = "pytest_bdd_orama.hooks"

[tool.pytest.ini_options]
addopts = "-p pytester"

[tool.hatch.build.targets.wheel]
packages = ["pytest_bdd_orama"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced as an error
]
