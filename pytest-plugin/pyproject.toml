[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-bdd-orama"
version = "0.1.0"
description = "pytest plugin for the pytest-bdd-orama test runner"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7",
    "pytest-bdd>=6",
]

[project.entry-points.pytest11]
pytest-bdd-orama = "pytest_bdd_orama.hooks"

[tool.pytest.ini_options]
addopts = "-p pytester"

[tool.hatch.build.targets.wheel]
packages = ["pytest_bdd_orama"]
